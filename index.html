<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>债券交易处利率债观察</title><style>body{margin:auto;max-width:640px;padding:18px;background:#f3f5f8;font-family:-apple-system,"PingFang SC";color:#182a42}.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}.top h1{font-size:22px;margin:0}.top img{width:112px;height:auto}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0}.h{display:flex;justify-content:space-between;font-weight:700}.row{display:flex;justify-content:space-between;border-top:1px solid #eee;padding:11px 0}.mut{color:#77869a;font-size:12px}svg{width:100%;height:100px}polyline{fill:none;stroke:#c24c42;stroke-width:2}</style><div class="top"><h1>债券交易处<br>利率债观察</h1><img src="spd-bank-logo.jpg"></div><p class="mut" id="as">加载中…</p><div class="card"><div class="h">国债 10Y 收益率 <span id="last"></span></div><svg viewBox="0 0 100 60" preserveAspectRatio="none"><polyline id="line"/></svg></div><div class="card"><div class="h">国债一级发行 <span class="mut">最近7天</span></div><div id="issues"></div></div><div class="card"><div class="h">政府债缴款 <span class="mut">最近7天</span></div><div id="gov"></div></div><script>let f=x=>typeof x==='number'?x.toLocaleString('zh-CN',{maximumFractionDigits:2}):'--';fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{as.textContent='数据截至 '+d.as_of;let c=d.ten_year_yield_curve.filter(x=>typeof x.yield==='number'),v=c.map(x=>x.yield),lo=Math.min(...v),hi=Math.max(...v),s=hi-lo||1;last.textContent=(v.at(-1)||0).toFixed(3)+'% · '+c.at(-1).date;line.setAttribute('points',v.map((x,i)=>`${i/(v.length-1)*100},${52-(x-lo)/s*44}`).join(' '));issues.innerHTML=d.treasury_issues.map(x=>`<div class=row><div><b>${x.code||'--'}</b><br><span class=mut>${x.date} · ${x.tenor||'--'}</span></div><div style=text-align:right><b>${f(x.amount)} 亿</b><br><span class=mut>${x.yield_label} ${f(x.yield)}% · ${f(x.multiple)}倍</span></div></div>`).join('')||'暂无数据';gov.innerHTML=d.government_payments.map(x=>`<div class=row><b>${x.date}</b><span>${f(x.net)} 亿</span></div>`).join('')||'暂无数据'})</script>
